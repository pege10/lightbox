<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Lightbox – DSLR film szkennelés</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="A telefon kijelzője átvilágító padként analóg film DSLR-es szkenneléséhez. Ébren tartott képernyő, színprofilok, RGB finomhangolás.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lightbox">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --panel: rgba(14, 14, 17, .92);
    --line: #2c2c34;
    --chip: #23232b;
    --text: #f4f4f6;
    --muted: #9c9ca6;
    --ok: #7bd48a;
    --warn: #e6a86a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    background: #fff;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-text-size-adjust: 100%;
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }

  /* ------- az UI réteg, ami 3 mp után elhalványul ------- */
  #ui {
    position: fixed; inset: 0;
    display: flex; align-items: flex-end; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 14px)
             calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 14px);
    opacity: 1;
    transition: opacity .6s ease;
    z-index: 10;
  }
  body.hidden-ui #ui { opacity: 0; pointer-events: none; }

  #panel {
    width: 100%; max-width: 430px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 18px 44px rgba(0,0,0,.35);
    max-height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .head h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  #status { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  #status.ok { color: var(--ok); }
  #status.warn { color: var(--warn); }

  button {
    appearance: none; font-family: inherit; cursor: pointer;
    background: var(--chip); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
  }
  button:active { transform: scale(.985); }

  #fs { padding: 10px 14px; font-size: 13px; white-space: nowrap; }

  .label { font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

  .profiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .profiles button {
    padding: 10px 6px 11px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-size: 12px; line-height: 1.25; text-align: center;
  }
  .profiles button[aria-pressed="true"] { border-color: #fff; box-shadow: inset 0 0 0 1px #fff; }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); }

  .sliders { margin-top: 16px; }
  .slider + .slider { margin-top: 12px; }
  .slider .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; }
  .slider .name { color: var(--muted); letter-spacing: .4px; }
  .slider .val { font-variant-numeric: tabular-nums; color: var(--text); }
  .slider .val small { color: var(--muted); font-size: 11px; margin-left: 6px; }

  input[type=range] { width: 100%; appearance: none; background: transparent; margin: 4px 0 0; height: 26px; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; }
  input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; border: none; margin-top: -9px; box-shadow: 0 2px 8px rgba(0,0,0,.55);
  }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; }
  input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border: none; border-radius: 50%; background: #fff; }
  #br::-webkit-slider-runnable-track { background: linear-gradient(90deg, #1b1b20, #ffffff); }
  #br::-moz-range-track { background: linear-gradient(90deg, #1b1b20, #ffffff); }
  #r::-webkit-slider-runnable-track { background: linear-gradient(90deg, #1b1b20, #ff4a4a); }
  #g::-webkit-slider-runnable-track { background: linear-gradient(90deg, #1b1b20, #49e06a); }
  #b::-webkit-slider-runnable-track { background: linear-gradient(90deg, #1b1b20, #4a9dff); }
  #r::-moz-range-track { background: linear-gradient(90deg, #1b1b20, #ff4a4a); }
  #g::-moz-range-track { background: linear-gradient(90deg, #1b1b20, #49e06a); }
  #b::-moz-range-track { background: linear-gradient(90deg, #1b1b20, #4a9dff); }

  #keepawake {
    position: fixed; left: 0; bottom: 0;
    width: 3px; height: 3px; opacity: .02;
    pointer-events: none; z-index: 1;
  }

  #diag {
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--line);
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #7d7d88;
    white-space: pre-wrap;
  }
  #diag b { color: var(--text); font-weight: 600; }
  #diag .bad { color: var(--warn); }
  #diag .good { color: var(--ok); }

  .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
  .foot p { margin: 0; font-size: 11px; color: #70707a; }
  #reset { padding: 8px 12px; font-size: 12px; }
</style>
</head>
<body>

<div id="ui">
  <section id="panel">
    <div class="head">
      <div>
        <h1>Lightbox</h1>
        <p id="status">Képernyő ébren tartása indul…</p>
      </div>
      <button id="fs" type="button">Teljes képernyő</button>
    </div>

    <p class="label">Színprofil</p>
    <div class="profiles" id="profiles">
      <button type="button" data-p="bw"><span class="dot" style="background:rgb(255,255,255)"></span>Fekete-fehér</button>
      <button type="button" data-p="neg"><span class="dot" style="background:rgb(180,220,255)"></span>Színes negatív</button>
      <button type="button" data-p="slide"><span class="dot" style="background:rgb(255,244,224)"></span>Dia</button>
    </div>

    <div class="sliders">
      <p class="label">Fényerő</p>
      <div class="slider">
        <div class="row"><span class="name">Kijelző</span><span class="val" id="brVal">100%</span></div>
        <input type="range" id="br" min="5" max="100" step="1" value="100" aria-label="Fényerő">
      </div>

      <p class="label" style="margin-top:16px">RGB finomhangolás</p>
      <div class="slider">
        <div class="row"><span class="name">Piros</span><span class="val" id="rVal">100%<small>255</small></span></div>
        <input type="range" id="r" min="0" max="100" step="1" value="100" aria-label="Piros">
      </div>
      <div class="slider">
        <div class="row"><span class="name">Zöld</span><span class="val" id="gVal">100%<small>255</small></span></div>
        <input type="range" id="g" min="0" max="100" step="1" value="100" aria-label="Zöld">
      </div>
      <div class="slider">
        <div class="row"><span class="name">Kék</span><span class="val" id="bVal">100%<small>255</small></span></div>
        <input type="range" id="b" min="0" max="100" step="1" value="100" aria-label="Kék">
      </div>
    </div>

    <div class="foot">
      <p>A menü 3 mp tétlenség után eltűnik. Érintésre visszajön.</p>
      <button id="reset" type="button">Alap</button>
    </div>

    <div id="diag">Diagnosztika…</div>
  </section>
</div>

<script>
(function () {
  'use strict';

  var BUILD = 'v4 – 2026-09-03';

  var PRESETS = {
    bw:    [100, 100, 100],
    neg:   [71, 86, 100],
    slide: [100, 96, 88]
  };
  var IDLE_MS = 3000;

  var $ = function (id) { return document.getElementById(id); };
  var panel = $('panel'), statusEl = $('status');
  var inputs = { r: $('r'), g: $('g'), b: $('b'), br: $('br') };
  var vals = { r: $('rVal'), g: $('gVal'), b: $('bVal'), br: $('brVal') };

  /* r/g/b: színegyensúly 0-100%, br: közös fényerő 5-100% (alapból max) */
  var state = { r: 100, g: 100, b: 100, br: 100 };
  try {
    var saved = JSON.parse(localStorage.getItem('lightbox.rgb') || 'null');
    if (saved) {
      ['r', 'g', 'b'].forEach(function (k) {
        if (typeof saved[k] === 'number' && saved[k] >= 0 && saved[k] <= 100) state[k] = saved[k];
      });
      if (typeof saved.br === 'number' && saved.br >= 5 && saved.br <= 100) state.br = saved.br;
    }
  } catch (e) {}

  function to255(pct) { return Math.round(pct * state.br * 255 / 10000); }

  function apply() {
    var c = 'rgb(' + to255(state.r) + ',' + to255(state.g) + ',' + to255(state.b) + ')';
    document.documentElement.style.background = c;
    document.body.style.background = c;
    ['r', 'g', 'b'].forEach(function (k) {
      if (inputs[k].value !== String(state[k])) inputs[k].value = state[k];
      vals[k].innerHTML = state[k] + '%<small>' + to255(state[k]) + '</small>';
    });
    if (inputs.br.value !== String(state.br)) inputs.br.value = state.br;
    vals.br.textContent = state.br + '%';
    Array.prototype.forEach.call(document.querySelectorAll('#profiles button'), function (btn) {
      var p = PRESETS[btn.dataset.p];
      btn.setAttribute('aria-pressed', String(p[0] === state.r && p[1] === state.g && p[2] === state.b));
    });
    try { localStorage.setItem('lightbox.rgb', JSON.stringify(state)); } catch (e) {}
  }

  ['r', 'g', 'b', 'br'].forEach(function (k) {
    inputs[k].addEventListener('input', function () {
      var v = parseInt(inputs[k].value, 10) || 0;
      state[k] = (k === 'br') ? Math.max(5, v) : v;
      apply();
    });
  });

  $('profiles').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    var p = PRESETS[btn.dataset.p];
    state.r = p[0]; state.g = p[1]; state.b = p[2];
    apply();
  });

  $('reset').addEventListener('click', function () {
    state.r = state.g = state.b = state.br = 100; apply();
  });

  /* ---------- képernyő ébren tartása ----------
     Két réteg: Screen Wake Lock API (iOS 16.4+), és mellette egy néma, 3 px-es
     hurokvideó, ami a régebbi/korlátozott esetekben tartja ébren a kijelzőt. */
  var lock = null, wlPending = false, wlError = '';
  var video = $('keepawake'), videoOn = false;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }

  function awakeStatus() {
    if (lock) setStatus('A képernyő ébren van tartva.', 'ok');
    else if (videoOn) setStatus('Ébren tartás videós tartalékkal.', 'ok');
    else setStatus('Koppints a képernyőre az ébren tartáshoz.', 'warn');
    updateDiag();
  }

  function requestWakeLock() {
    if (!('wakeLock' in navigator)) { wlError = 'nincs API'; awakeStatus(); return; }
    if (lock || wlPending || document.visibilityState !== 'visible') return;
    wlPending = true;
    navigator.wakeLock.request('screen').then(function (l) {
      wlPending = false; wlError = '';
      lock = l;
      lock.addEventListener('release', function () { lock = null; awakeStatus(); });
      awakeStatus();
    }).catch(function (e) {
      wlPending = false;
      wlError = (e && e.name) ? e.name : 'hiba';
      awakeStatus();
    });
  }

  function startVideo() {
    if (!video || videoOn) return;
    var p;
    try { p = video.play(); } catch (e) { return; }
    if (p && p.then) {
      p.then(function () { videoOn = true; awakeStatus(); })
       .catch(function () { videoOn = false; updateDiag(); });
    } else {
      videoOn = !video.paused; awakeStatus();
    }
  }

  if (video) {
    video.addEventListener('pause', function () { videoOn = false; updateDiag(); });
    video.addEventListener('playing', function () { videoOn = true; awakeStatus(); });
  }

  function keepAwake() { requestWakeLock(); startVideo(); }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') keepAwake();
  });
  window.addEventListener('focus', keepAwake);
  window.addEventListener('pageshow', keepAwake);

  /* ha az első kérés elbukott (pl. felhasználói gesztus nélkül), érintésre újra */
  ['pointerdown', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, keepAwake, { passive: true });
  });

  /* rendszeres ellenőrzés: ha bármelyik réteg leállt, újraindítjuk */
  setInterval(function () {
    if (document.visibilityState !== 'visible') return;
    if (!lock) requestWakeLock();
    if (video && video.paused) startVideo();
  }, 10000);

  /* ---------- teljes képernyő ---------- */
  var fsBtn = $('fs');
  var docEl = document.documentElement;

  function fsActive() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }

  function syncFsLabel() {
    fsBtn.textContent = fsActive() ? 'Kilépés' : 'Teljes képernyő';
  }

  fsBtn.addEventListener('click', function () {
    if (!fsActive()) {
      var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
      if (req) {
        var p = req.call(docEl);
        if (p && p.catch) p.catch(function () {});
      } else {
        setStatus('Teljes képernyő: tedd ki a Főképernyőre, úgy sávok nélkül indul.', 'warn');
      }
    } else {
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) {
        var q = exit.call(document);
        if (q && q.catch) q.catch(function () {});
      }
    }
    setTimeout(syncFsLabel, 150);
  });
  document.addEventListener('fullscreenchange', syncFsLabel);
  document.addEventListener('webkitfullscreenchange', syncFsLabel);

  /* ---------- UI automatikus elrejtése ---------- */
  var idleTimer = null;

  function hideUI() { document.body.classList.add('hidden-ui'); }

  function showUI() {
    document.body.classList.remove('hidden-ui');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(hideUI, IDLE_MS);
  }

  /* Ha a menü rejtve van, az első érintés csak visszahozza – nem nyom meg gombot,
     mert a #ui ilyenkor pointer-events: none, az esemény a dokumentumig jut. */
  ['pointerdown', 'touchstart', 'mousemove', 'keydown', 'wheel'].forEach(function (ev) {
    document.addEventListener(ev, showUI, { passive: true });
  });
  document.addEventListener('input', showUI, { passive: true });

  /* dupla koppintásos nagyítás és gesztus-zoom kikapcsolása */
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });
  panel.addEventListener('pointerdown', function (e) { e.stopPropagation(); showUI(); });

  /* ---------- diagnosztika ---------- */
  var diagEl = $('diag');

  function displayMode() {
    var modes = ['fullscreen', 'standalone', 'minimal-ui', 'browser'];
    for (var i = 0; i < modes.length; i++) {
      if (window.matchMedia('(display-mode: ' + modes[i] + ')').matches) return modes[i];
    }
    return navigator.standalone ? 'standalone (iOS)' : 'ismeretlen';
  }

  function safeAreaTop() {
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden;';
    document.body.appendChild(probe);
    var h = Math.round(probe.getBoundingClientRect().height);
    probe.parentNode.removeChild(probe);
    return h;
  }

  function updateDiag() {
    if (!diagEl) return;
    var mode = displayMode();
    var top = safeAreaTop();
    var wl = lock ? '<span class="good">aktív</span>'
           : (('wakeLock' in navigator) ? '<span class="bad">nem aktív' + (wlError ? ' (' + wlError + ')' : '') + '</span>'
                                        : '<span class="bad">nincs API</span>');
    var vid = videoOn ? '<span class="good">fut</span>' : '<span class="bad">áll</span>';
    diagEl.innerHTML =
      'Mód: <b>' + mode + '</b>' +
      (mode === 'browser' ? '  <span class="bad">(tedd ki a főképernyőre)</span>' : '') + '\n' +
      'Felső biztonsági zóna: <b>' + top + 'px</b> ' + (top > 0 ? '(a tartalom a sáv alá fut)' : '(a rendszer külön sávot tart fenn)') + '\n' +
      'Wake Lock: ' + wl + '   Videó: ' + vid + '\n' +
      'Ablak: <b>' + window.innerWidth + '×' + window.innerHeight + '</b>  Képernyő: <b>' + screen.width + '×' + screen.height + '</b>\n' +
      'Build: <b>' + BUILD + '</b>';
  }

  window.addEventListener('resize', updateDiag);

  apply();
  showUI();
  updateDiag();
  keepAwake();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
